name: Programmatic SEO gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm run test:public-privacy
      - run: npm run test:email-signature
      - run: npm run test:og-card
      - run: node scripts/check-ai-crawlers.mjs
      - run: node scripts/check-programmatic-routes.mjs
      - run: npm run seo:indexnow:dry-run
      - run: npm audit --audit-level=high
